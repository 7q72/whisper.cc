// Prepare particles array
const particles = [];
const originalPositions = [];

function createParticles() {
    ascii.split('\n').forEach((line, y) => {
        line.split('').forEach((char, x) => {
            if(char.trim() !== ''){
                const p = document.createElement('div');
                p.className = 'particle';
                p.textContent = char;
                let left = x*8 + window.innerWidth/2 - 400;
                let top = y*14 + window.innerHeight/2 - 200;
                p.style.left = left + 'px';
                p.style.top = top + 'px';
                document.body.appendChild(p);
                particles.push({el: p, x: left, y: top, vx: 0, vy: 0});
                originalPositions.push({x: left, y: top});
            }
        });
    });
}

// Animate particles: explode and reform
let explode = true;
function animateParticles() {
    particles.forEach((p, i) => {
        if(explode){
            p.vx += (Math.random()-0.5)*2;
            p.vy += (Math.random()-0.5)*2;
        } else {
            p.vx += (originalPositions[i].x - parseFloat(p.el.style.left))*0.05;
            p.vy += (originalPositions[i].y - parseFloat(p.el.style.top))*0.05;
        }
        let left = parseFloat(p.el.style.left) + p.vx;
        let top = parseFloat(p.el.style.top) + p.vy;
        p.el.style.left = left + 'px';
        p.el.style.top = top + 'px';
        p.vx *= 0.9;
        p.vy *= 0.9;
    });
    requestAnimationFrame(animateParticles);
}

// Toggle explode/reform every 3 seconds
setInterval(()=>{explode=!explode},3000);

window.addEventListener('mousemove', e=>{
    particles.forEach(p=>{
        let dx = p.el.offsetLeft - e.clientX;
        let dy = p.el.offsetTop - e.clientY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 100){
            p.vx += dx*0.05/dist;
            p.vy += dy*0.05/dist;
        }
    });
});

document.addEventListener('click', () => {
    const input = document.getElementById('userInput');
    input.style.display = 'block';
    input.focus();
    document.getElementById('bgMusic').src += "&autoplay=1";
});

createParticles();
