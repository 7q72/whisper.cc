        background: #000;
        overflow: hidden;
        color: #ff0000;
    }

    #site-name {
        position: absolute;
        font-size: 3rem;
        font-weight: bold;
        color: #ff0000;
        animation: moveName 8s infinite alternate;
        user-select: none;
        z-index: 1000;
    }

    @keyframes moveName {
        0% { top: 10px; left: 10px; }
        25% { top: 50px; left: 80%; }
        50% { top: 80%; left: 20%; }
        75% { top: 60%; left: 60%; }
        100% { top: 10px; left: 10px; }
    }

    nav {
        background: #110000;
        padding: 1rem;
        display: flex;
        gap: 2rem;
        justify-content: center;
        border-bottom: 2px solid #ff0000;
        z-index: 1000;
        position: relative;
    }

    nav a {
        color: #ff4d4d;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.2rem;
        transition: 0.3s;
    }

    nav a:hover {
        color: #ff9999;
        text-shadow: 0 0 10px #ff0000;
    }

    .container {
        padding: 2rem;
        text-align: center;
        max-width: 1200px;
        margin: auto;
        position: relative;
        z-index: 1;
    }

    #horizontal-box {
        width: 60%;
        margin: 2rem auto;
        padding: 1rem;
        background: #220000;
        border: 2px solid #ff0000;
        font-size: 1.5rem;
        color: #fff;
        text-align: center;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 10px #ff0000; }
        50% { box-shadow: 0 0 25px #ff4d4d; }
    }

    .particle {
        position: absolute;
        font-family: monospace;
        pointer-events: none;
        user-select: none;
        z-index: 0;
    }

    footer {
        text-align: center;
        margin-top: 2rem;
        color: #ff4d4d;
        border-top: 2px solid #ff0000;
        padding-top: 1rem;
        font-size: 0.9rem;
        z-index: 1000;

    const particles = [];

    function createParticles() {
        ascii.split('\n').forEach((line, y) => {
            line.split('').forEach((char, x) => {
                if (char.trim() !== '') {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.textContent = char;
                    particle.style.left = (x * 8 + window.innerWidth / 2 - 200) + 'px';
                    particle.style.top = (y * 14 + window.innerHeight / 2 - 100) + 'px';
                    particle.style.color = `rgb(${Math.random()*255},0,0)`;
                    document.body.appendChild(particle);
                    particles.push({
                        el: particle,
                        vx: (Math.random()-0.5)*2,
                        vy: (Math.random()-0.5)*2
                    });
                }
            });
        });
    }

    function animateParticles() {
        particles.forEach(p => {
            let left = parseFloat(p.el.style.left);
            let top = parseFloat(p.el.style.top);

            left += p.vx;
            top += p.vy;

            p.el.style.left = left + 'px';
            p.el.style.top = top + 'px';
        });
        requestAnimationFrame(animateParticles);
    }

    window.addEventListener('mousemove', (e) => {
        particles.forEach(p => {
            let dx = p.el.offsetLeft - e.clientX;
            let dy = p.el.offsetTop - e.clientY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 100){
                p.vx += dx*0.05/dist;
                p.vy += dy*0.05/dist;
            }
        });
    });

    createParticles();
    animateParticles();
